[pytest]
# 프로젝트 루트를 import 경로에 추가 (src.* 패키지 해석)
pythonpath = .
testpaths = tests
# 콘솔 cp949 유니코드 인코딩 이슈 회피
python_files = test_*.py
python_functions = test_*

# 참고 마커(문서·선택 실행용). 설치 빌드(build.py)는 pytest 를 호출하지 않는다.
#   python -m pytest tests/ -m "not source_only"   # 예: 소스 introspection 제외
markers =
    source_only: needs pure .py source (inspect.getsource / AST on source)
    reload_only: needs importlib.reload to re-bake import-time state
    root_only: imports repo-root modules (release.py, build.py, …)
